name: 🐞 Reportar bug
description: Algo deu errado no YASS? Conte pra gente.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Valeu por testar o YASS! Quanto mais detalhes, mais rápido a gente corrige.
  - type: input
    id: build
    attributes:
      label: Versão do YASS
      description: Aparece no menu do jogo (ex. 0.2.4, build 1794753952).
      placeholder: "0.2.4"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Aparelho
      placeholder: "ex. Samsung Galaxy A54"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Versão do Android
      placeholder: "ex. Android 14"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri o jogo
        2. Toquei em ...
        3. ...
  - type: dropdown
    id: frequency
    attributes:
      label: Com que frequência acontece?
      options:
        - Sempre
        - Às vezes
        - Aconteceu uma vez
  - type: dropdown
    id: area
    attributes:
      label: Onde aconteceu?
      options:
        - Jogabilidade
        - Menu / interface
        - Atualização automática
        - Instalação
        - Desempenho / travamento
        - Outro
  - type: textarea
    id: media
    attributes:
      label: Prints ou vídeo
      description: Arraste arquivos aqui, se tiver.
